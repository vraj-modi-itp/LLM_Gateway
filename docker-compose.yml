version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: proxy_postgres
    environment:
      POSTGRES_USER: proxy_user
      POSTGRES_PASSWORD: proxy_password
      POSTGRES_DB: proxy_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # This maps our init script to automatically create tables on first run
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant
    container_name: proxy_qdrant
    ports:
      - "6333:6333" # REST API port
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  qdrant_data: